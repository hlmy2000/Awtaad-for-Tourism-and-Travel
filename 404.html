
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطأ 404 - المسار الجوي غير موجود - أوتاد للسفر الفاخر</title>

    <!-- خط Cairo من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    
    <!-- ملف الـ CSS الأساسي المشترك -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- ملف الـ CSS المخصص لهذه الصفحة الاستثنائية -->
    <link rel="stylesheet" href="./css/404.css">
</head>
<body class="error-page-body">

    <!-- حاوية بوكس الخطأ المركزي الكريستالي الفخم -->
    <main class="error-center-wrapper">
        <div class="error-card-lux">
            
            <!-- رادار النبض الذهبي الدائري ببرستيج أنظمة الملاحة الجوية -->
            <div class="error-radar-wrapper">
                <div class="error-radar-pulse"></div>
                <i class="fa-solid fa-plane-slash error-plane-icon"></i>
            </div>

            <!-- رقم الخطأ العملاق الباهظ الثمن -->
            <h1 class="error-massive-num">404</h1>
            
            <h2>المسار اللوجستي غير موجود أو تم تغييره</h2>
            <p class="error-desc-text">عذراً، يبدو أن الرابط الذي حاولت الهبوط عليه غير مدرج في منظومتنا الجوية حالياً، أو تم نقله وتحديثه بامتثال صارم لحماية التحركات [onecorpus].</p>
            
            <!-- السطر التسويقي المعتمد لبراند أوتاد لزيادة الفخامة الهيكلية -->
            <p class="error-brand-slogan">"المقام اللوجستي الأول لبعثات النخبة، والمعيار المعتمد لرحلات الطيران الخاص."</p>

            <!-- زر العودة العريض والمشرق بالنبض المتوهج نحو الصفحة الرئيسية -->
            <div class="error-cta-action">
                <a href="./index.html" class="btn-gold error-home-btn"><i class="fa-solid fa-house-chimney"></i> العودة الآمنة للمنصة الرئيسية</a>
            </div>

        </div>
    </main>

    <!-- استدعاء ملف الـ JS الخارجي الموحد المشترك (لتشغيل لوحة الترس والشات والوضع الليلي تلقائياً) -->
    <script src="./js/script.js"></script>
